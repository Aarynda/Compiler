tokens:
  TYPE: "[i][n][t]"
  IDENTIFIER: "[a-zA-Z_][a-zA-Z0-9_]*"
  INT_LIT: "[0-9]+"
  ASSIGN: "="
  EOL: ";"
  BINARY_OP_MAJOR: "[/*]"
  BINARY_OP_MINOR: "[+-]"
  # IF_KEYWORD: "[i][f]"
  # ELSE_KEYWORD: "[e][l][s][e]"
  # LEFT_PAREN: "("
  # RIGHT_PAREN: ")"
  # LEFT_BRACE: "{"
  # RIGHT_BRACE: "}"
  # CONDITIONAL: "[<>]"
constructs:
  EXPR: IDENTIFIER; VarNode($IDENTIFIER.value)| INT_LIT; IntLitNode($INT_LIT.value)| EXPR BINARY_OP_MAJOR EXPR; BinaryOpNode($BINARY_OP_MAJOR.value, $EXPR.node, $EXPR.node)
  TERM: TERM BINARY_OP_MINOR TERM; BinaryOpNode($BINARY_OP_MINOR.value, $TERM.node, $TERM.node)| TERM BINARY_OP_MINOR EXPR; BinaryOpNode($BINARY_OP_MINOR.value, $TERM.node, $EXPR.node)| EXPR BINARY_OP_MINOR TERM; BinaryOpNode($BINARY_OP_MINOR.value, $EXPR.node, $TERM.node)| EXPR BINARY_OP_MINOR EXPR; BinaryOpNode($BINARY_OP_MINOR.value, $EXPR.node, $EXPR.node)
  ASSIGNMENT: EXPR ASSIGN TERM EOL; AssignNode($EXPR.node, $TERM.node)| EXPR ASSIGN EXPR EOL; AssignNode($EXPR.node, $EXPR.node)
  STATEMENT: ASSIGNMENT; append($ASSIGNMENT.node)| INITIALIZATION; append($INITIALIZATION.node)
  INITIALIZATION: TYPE ASSIGNMENT; InitializationNode($ASSIGNMENT.node, $TYPE.value)| TYPE IDENTIFIER EOL; InitializationNode($IDENTIFIER.value, $TYPE.value)
  # COMPARISON: EXPR CONDITIONAL EXPR; ComparisonNode($CONDITIONAL.value, $EXPR.node, $EXPR.node)
  # IF_STATEMENT: IF_KEYWORD LEFT_PAREN COMPARISON RIGHT_PAREN LEFT_BRACE STATEMENT RIGHT_BRACE; IfNode($COMPARISON.node, $STATEMENT.node)